name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared logic and build web
        run: bash ./gradlew :shared:jvmTest :composeApp:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: family-app-web
          path: composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
